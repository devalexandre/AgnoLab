name: agnolab

# Production compose: AgnoLab plus every self-hostable resource its flows can use
# (Postgres/pgvector, Redis, RabbitMQ, Kafka, NATS, WhatsApp gateway).
#
# Notes:
# - The API generates and EXECUTES Python code. AGNOLAB_API_KEY is REQUIRED here;
#   without it those endpoints are unauthenticated remote code execution.
# - Backing services are NOT published to the host. They are reachable by the API
#   over the internal network at their service names (postgres, redis, rabbitmq,
#   kafka, nats). Use those hostnames in your flow nodes, not "localhost".
# - AWS SQS and Google Pub/Sub are cloud services in production: point those nodes
#   at the real endpoints with real credentials. The local emulators used for
#   development live in docker-compose.dev.yml only.
#
# Copy .env.example to .env and fill in the required secrets before starting.

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    restart: unless-stopped
    logging: *default-logging
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      PYTHONUNBUFFERED: "1"

      # --- Security (see .env.example) -------------------------------------
      # Required: gates the code-generation and execution endpoints.
      AGNOLAB_API_KEY: ${AGNOLAB_API_KEY:?set AGNOLAB_API_KEY to a long random secret}
      # Browser origins allowed to call the API (where the web app is served).
      AGNOLAB_CORS_ORIGINS: ${AGNOLAB_CORS_ORIGINS:-http://localhost:5173}
      # Executor guards: hard timeout ceiling, output cap, optional memory cap.
      AGNOLAB_MAX_EXECUTION_SECONDS: ${AGNOLAB_MAX_EXECUTION_SECONDS:-300}
      AGNOLAB_MAX_OUTPUT_MB: ${AGNOLAB_MAX_OUTPUT_MB:-128}
      AGNOLAB_MAX_MEMORY_MB: ${AGNOLAB_MAX_MEMORY_MB:-}
      # Isolate the runner env so executed flow code cannot read unrelated host
      # secrets. Known provider credential vars are still forwarded.
      AGNOLAB_ISOLATE_ENV: ${AGNOLAB_ISOLATE_ENV:-1}
      # Extra host env vars to forward into the isolated runner (comma-separated),
      # e.g. AWS_ACCESS_KEY_ID,AWS_SECRET_ACCESS_KEY,GOOGLE_APPLICATION_CREDENTIALS
      AGNOLAB_FORWARD_ENV: ${AGNOLAB_FORWARD_ENV:-}

      # --- Model providers (set the ones you use) ---------------------------
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}

      # --- Cloud queues (real endpoints in production) ----------------------
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}

      # --- WhatsApp gateway --------------------------------------------------
      WHATSAPP_GATEWAY_BASE_URL: http://whatsapp:21465
      WHATSAPP_GATEWAY_SECRET_KEY: ${WHATSAPP_GATEWAY_SECRET_KEY:?set WHATSAPP_GATEWAY_SECRET_KEY to a long random secret}
      WHATSAPP_WEBHOOK_BASE_URL: ${WHATSAPP_WEBHOOK_BASE_URL:-http://api:8000}
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      # Saved flows, listener state, and runtime data. Defaults to the repo path
      # (unchanged from previous releases); point AGNOLAB_DATA_DIR elsewhere in
      # production and back this directory up.
      - ${AGNOLAB_DATA_DIR:-./apps/api/data}:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      nats:
        condition: service_started
      kafka:
        condition: service_started
      whatsapp:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      args:
        # Baked in at build time: the public URL browsers use to reach the API.
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-5173}:4173"

  # --- Backing services (internal only; reachable at their service names) ----

  postgres:
    # pgvector image so both the `database` (PostgresDb) and `vector_db` (PgVector)
    # nodes work against the same instance.
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-agnolab}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-agnolab}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-agnolab} -d ${POSTGRES_DB:-agnolab}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    logging: *default-logging
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD}", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management
    restart: unless-stopped
    logging: *default-logging
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-agnolab}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?set RABBITMQ_PASSWORD}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    ports:
      # Management UI, bound to loopback only (not internet-exposed).
      - "127.0.0.1:15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5

  kafka:
    image: apache/kafka:3.7.2
    restart: unless-stopped
    logging: *default-logging
    hostname: kafka
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # Internal-only listeners: no host exposure.
      KAFKA_LISTENERS: PLAINTEXT://:19092,CONTROLLER://:29093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      CLUSTER_ID: ${KAFKA_CLUSTER_ID:-MDEyMzQ1Njc4OTAxMjM0NQ}
    volumes:
      - kafka_data:/var/lib/kafka/data

  nats:
    image: nats:2-alpine
    restart: unless-stopped
    logging: *default-logging
    command: ["-js", "-sd", "/data"]
    volumes:
      - nats_data:/data

  whatsapp:
    build:
      context: ./infra/wppconnect
      dockerfile: Dockerfile
    restart: unless-stopped
    logging: *default-logging
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      WPPCONNECT_SECRET_KEY: ${WHATSAPP_GATEWAY_SECRET_KEY:?set WHATSAPP_GATEWAY_SECRET_KEY to a long random secret}
      WPPCONNECT_PORT: "21465"
      WPPCONNECT_HOST: ${WPPCONNECT_HOST:-http://localhost}
    ports:
      # Needed to scan the pairing QR code; bound to loopback by default.
      - "127.0.0.1:21465:21465"
    volumes:
      - whatsapp_user_data:/opt/wppconnect-server/userDataDir

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
  kafka_data:
  nats_data:
  whatsapp_user_data:
